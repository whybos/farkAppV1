<div class="admin-panel-wrapper">
  <div class="admin-header-bar d-flex flex-wrap justify-content-between align-items-center gap-3">
    <div>
      <h2 class="admin-panel-title">Yönetim Paneli</h2>
      <p class="admin-panel-subtitle">
        Site içeriklerini, görselleri, menü bağlantılarını ve FARK'ında yayınlarını buradan yönetebilirsiniz.
      </p>
    </div>

    <button
      type="button"
      class="btn btn-outline-danger d-inline-flex align-items-center gap-2"
      [disabled]="isResetting()"
      (click)="resetDatabase()"
    >
      @if (isResetting()) {
        <span class="spinner-border spinner-border-sm" role="status"></span>
        <span>Sıfırlanıyor...</span>
      } @else {
        <i class="bi bi-database-dash"></i>
        <span>Veritabanını Sıfırla</span>
      }
    </button>
  </div>

  <!-- Sekmeler -->
  <ul class="admin-tabs">
    @for (item of tabs; track item.url) {
      <li class="tab-item">
        <a
          class="tab-button"
          [routerLink]="item.url"
          routerLinkActive="active-tab"
        >
          <span class="tab-text">{{ item.title }}</span>
        </a>
      </li>
    }
  </ul>

  <div class="admin-outlet-container">
    <router-outlet></router-outlet>
  </div>
</div>
